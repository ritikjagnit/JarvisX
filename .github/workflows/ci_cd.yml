name: JarvisX CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------
  # 1. SYNTAX & INTEGRITY VERIFICATION (CI)
  # -----------------------------------------------------------
  verify-code:
    name: Verify Code Syntax
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python Syntax & Compilation Check
        run: |
          python -m compileall -q .

  # -----------------------------------------------------------
  # 2. AUTOMATED CLIENT RELEASE PACKAGING (CD)
  # -----------------------------------------------------------
  build-and-package:
    name: Build & Publish Release Package
    needs: verify-code
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Clean Client Release ZIP
        run: |
          python build_client_package.py

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisX_Client_Release
          path: JarvisX_Client_Release.zip
          retention-days: 30

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('JarvisX Release {0}', github.ref_name) || 'JarvisX v2.0 Latest Release' }}
          files: JarvisX_Client_Release.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------
  # 3. STANDALONE WINDOWS .EXE COMPILER (CD)
  # -----------------------------------------------------------
  build-executable:
    name: Compile Standalone Windows .exe
    needs: verify-code
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller and Build Exe
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pyautogui opencv-python numpy
          python build_exe.py --onefile

      - name: Upload Standalone .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisX_Windows_Executable
          path: dist/JarvisX.exe
          retention-days: 30

      - name: Attach .exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0-latest' }}
          files: dist/JarvisX.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
